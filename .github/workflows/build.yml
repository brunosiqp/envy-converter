name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar teste do motor interno
        run: dotnet build tests/EnvyConverter.Smoke/EnvyConverter.Smoke.csproj -c Release

      - name: Gerar executável
        run: dotnet publish src/EnvyConverter/EnvyConverter.csproj -c Release -o publish

      - name: Abrir o programa (verifica se a interface inicia)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish/EnvyConverter.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "O programa fechou ao iniciar (código $($p.ExitCode))." }
          Stop-Process -Id $p.Id -Force
          Write-Host "Interface iniciou corretamente."

      - name: Empacotar
        shell: pwsh
        run: Compress-Archive -Path publish/EnvyConverter.exe, publish/tema.json -DestinationPath EnvyConverter-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EnvyConverter-win-x64
          path: EnvyConverter-win-x64.zip

      # Cria a Release da versão do projeto (ex.: v1.1.0) se ela ainda não existir.
      - name: Publicar release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$proj = Get-Content src/EnvyConverter/EnvyConverter.csproj
          $version = "v" + ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          gh release view $version *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $version já existe."; exit 0 }
          gh release create $version EnvyConverter-win-x64.zip --target $env:GITHUB_SHA --title "Envy Converter $version" --notes-file .github/release-notes.md

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Instalar workload Android
        run: dotnet workload install maui-android

      - name: Instalar dependências do SDK Android
        run: >
          dotnet build src/EnvyConverter.Mobile/EnvyConverter.Mobile.csproj -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory=$ANDROID_HOME -p:JavaSdkDirectory=$JAVA_HOME -p:AcceptAndroidSDKLicenses=True

      - name: Gerar APK
        run: |
          set -o pipefail
          dotnet publish src/EnvyConverter.Mobile/EnvyConverter.Mobile.csproj -c Release -o apk-out \
            -p:AndroidSdkDirectory=$ANDROID_HOME -p:JavaSdkDirectory=$JAVA_HOME 2>&1 | tee build.log || {
            # Mostra os erros como anotações, para aparecerem no resumo da execução.
            grep -E ": error |error [A-Z]+[0-9]+" build.log | sort -u | head -40 | while read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Separar APK
        run: |
          ls -la apk-out
          cp "$(ls apk-out/*-Signed.apk | head -1)" EnvyConverter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EnvyConverter-android
          path: EnvyConverter.apk

      # Guarda o APK mais recente num branch separado, fora do histórico do código.
      - name: Atualizar branch apk-build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir dist && cp EnvyConverter.apk dist/ && cd dist
          git init -q -b apk-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EnvyConverter.apk
          git commit -q -m "APK de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-build
