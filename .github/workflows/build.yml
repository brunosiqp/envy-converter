name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar teste do motor interno
        run: dotnet build tests/EnvyConverter.Smoke/EnvyConverter.Smoke.csproj -c Release

      - name: Gerar executável
        run: dotnet publish src/EnvyConverter/EnvyConverter.csproj -c Release -o publish

      - name: Abrir o programa (verifica se a interface inicia)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish/EnvyConverter.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "O programa fechou ao iniciar (código $($p.ExitCode))." }
          Stop-Process -Id $p.Id -Force
          Write-Host "Interface iniciou corretamente."

      - name: Empacotar
        shell: pwsh
        run: Compress-Archive -Path publish/EnvyConverter.exe, publish/tema.json -DestinationPath EnvyConverter-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EnvyConverter-win-x64
          path: EnvyConverter-win-x64.zip

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EnvyConverter-win-x64.zip
          generate_release_notes: true
